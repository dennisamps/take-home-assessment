# Prevents: hostNetwork: true (threat-model.md T2, T3).
#
# Mode:  ENFORCE from day one
# Scope: namespace accounts-api
# Why:   Host namespaces are a direct path from one pod to the node. The corrected workload does not use them, so nothing legitimate can break.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  annotations:
    accounts-api.mal/mode: enforce
    accounts-api.mal/scope: namespace-accounts-api
  name: disallow-host-namespaces
spec:
  validationActions: ["Deny"]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: ["deployments", "statefulsets", "daemonsets", "jobs", "cronjobs"]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: accounts-api-namespace
      expression: "object.metadata.namespace == 'accounts-api'"
  validations:
    - expression: >-
        !object.spec.?hostNetwork.orValue(false) &&
        !object.spec.?hostPID.orValue(false) &&
        !object.spec.?hostIPC.orValue(false)
      message: "hostNetwork, hostPID and hostIPC are not allowed: they undermine workload isolation and increase exposure to node-local services."
