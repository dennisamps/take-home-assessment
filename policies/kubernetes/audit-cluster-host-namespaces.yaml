# Detects, cluster-wide: hostNetwork: true (threat-model.md T2, T3).
#
# Mode:  AUDIT first (violations are reported, nothing is blocked)
# Scope: every namespace except accounts-api and kube-system
# Why:   One tenant on the host network endangers every tenant on the node (T3), but about a dozen other teams share this cluster and some will run agents that legitimately use host namespaces. Denying on day one would break their next deploy.
# Promotion to Enforce: see policies/kubernetes/README.md (two-week audit, zero unexplained violations, owners assigned, teams notified).
# The validation is identical to disallow-host-namespaces.yaml; a test keeps the two in step.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  annotations:
    accounts-api.mal/mode: audit
    accounts-api.mal/scope: cluster-except-accounts-api-and-kube-system
  name: audit-cluster-host-namespaces
spec:
  validationActions: ["Audit"]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: ["deployments", "statefulsets", "daemonsets", "jobs", "cronjobs"]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    # Every tenant namespace. accounts-api is already enforced by disallow-host-namespaces; kube-system holds
    # the cluster's own host-level agents.
    - name: other-tenant-namespaces
      expression: "!(object.metadata.namespace in ['accounts-api', 'kube-system'])"
  validations:
    - expression: >-
        !object.spec.?hostNetwork.orValue(false) &&
        !object.spec.?hostPID.orValue(false) &&
        !object.spec.?hostIPC.orValue(false)
      message: "hostNetwork, hostPID and hostIPC are not allowed: they undermine workload isolation and increase exposure to node-local services."
