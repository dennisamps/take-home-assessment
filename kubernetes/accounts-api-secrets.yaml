# Secrets delivery for accounts-api (Section 6; threat-model.md T2, T4).
# Full path, rotation and limits: data-protection/README.md and data-protection/rotation.md.
#
#   AWS Secrets Manager (source of truth)
#     -> accounts-api pod identity (iam/accounts-api-pod-policy.json: these two secrets only)
#     -> Secrets Store CSI Driver, AWS provider
#     -> read-only, in-memory files in the pod at /mnt/secrets
#     -> accounts-api process reads the files
#
# This file contains the NAMES of two secrets and nothing else. There is no secret value in
# Git, and there is deliberately no `secretObjects` block: nothing is copied into a Kubernetes
# Secret, so the credential never exists in etcd or in an environment variable.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: accounts-api-secrets
  namespace: accounts-api
spec:
  provider: aws
  parameters:
    region: ap-south-1
    # Fetch with the pod's own EKS Pod Identity, not the node role or the driver's identity.
    usePodIdentity: "true"
    objects: |
      # Database credential: one JSON document (username, password, host, port, dbname).
      # Kept as a single file because rotation changes username and password together.
      - objectName: "accounts-api/db-credentials"
        objectType: "secretsmanager"
        objectAlias: "db-credentials.json"
      # Third-party KYC provider API key.
      - objectName: "accounts-api/kyc-api-key"
        objectType: "secretsmanager"
        objectAlias: "kyc-api-key"
