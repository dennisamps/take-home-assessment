# Egress proxy allowlist for accounts-api (Section 5; threat-model.md T4, T2).
# The proxy is the only internet route the accounts-api NetworkPolicy allows, and this file is
# the whole of what it permits: an HTTPS tunnel to one hostname on one port.
# api.kyc-provider.example is a placeholder for the KYC provider's API hostname.

http_port 3128

acl kyc_provider dstdomain api.kyc-provider.example
acl https_port port 443
acl CONNECT method CONNECT

# The one permitted request. No leading dot on the hostname, so subdomains are not included.
http_access allow CONNECT kyc_provider https_port

# Everything else: any other hostname, any other port, and plain HTTP.
http_access deny all

# This is an allowlist, not a cache.
cache deny all

# One line per request, allowed or denied, with the destination, for the SIEM. The proxy
# container streams this file to stdout; Squid's unprivileged user cannot write to stdout itself.
access_log daemon:/var/log/squid/access.log squid
