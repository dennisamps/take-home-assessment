# The workload manifest as supplied for review, reconstructed from the assessment brief.
# Deliberately insecure: every policy in policies/kubernetes/ must reject it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-api
  namespace: accounts-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: accounts-api
  template:
    metadata:
      labels:
        app: accounts-api
    spec:
      serviceAccountName: accounts-api
      hostNetwork: true
      containers:
        - name: accounts-api
          image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/accounts-api:latest
          securityContext:
            privileged: false
            runAsUser: 0
          envFrom:
            - secretRef:
                name: accounts-api-env
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: host-logs
              mountPath: /var/log
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
        - name: host-logs
          hostPath:
            path: /var/log
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: accounts-api
  namespace: accounts-api
rules:
  - apiGroups: [""]
    resources: ["secrets", "pods", "configmaps"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: accounts-api
  namespace: accounts-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: accounts-api
subjects:
  - kind: ServiceAccount
    name: accounts-api
    namespace: accounts-api
