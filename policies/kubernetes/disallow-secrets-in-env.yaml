# Prevents: envFrom secretRef, which copies a whole Secret into the process environment
#
# Mode:  ENFORCE from day one
# Scope: namespace accounts-api
# Why:   Keeps credentials out of the process environment. Lower risk than the others, but the workload already complies and this team owns every manifest in the namespace, so there is nothing to audit first.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  annotations:
    accounts-api.mal/mode: enforce
    accounts-api.mal/scope: namespace-accounts-api
  name: disallow-secrets-in-env
spec:
  validationActions: ["Deny"]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: ["deployments", "statefulsets", "daemonsets", "jobs", "cronjobs"]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: accounts-api-namespace
      expression: "object.metadata.namespace == 'accounts-api'"
  variables:
    - name: allContainers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
  validations:
    - expression: >-
        variables.allContainers.all(c,
          c.?envFrom.orValue([]).all(e, !has(e.secretRef)) &&
          c.?env.orValue([]).all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef)))
      message: "Secrets must not be injected as environment variables (envFrom.secretRef or env.valueFrom.secretKeyRef)."
