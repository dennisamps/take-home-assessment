# Prevents: hostPath mounts such as /var/run/docker.sock and /var/log (threat-model.md T3).
#
# Mode:  ENFORCE from day one
# Scope: namespace accounts-api
# Why:   Host mounts are a direct path from one pod to the node and to other tenants' data. The corrected workload does not use them.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  annotations:
    accounts-api.mal/mode: enforce
    accounts-api.mal/scope: namespace-accounts-api
  name: disallow-host-path
spec:
  validationActions: ["Deny"]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: ["deployments", "statefulsets", "daemonsets", "jobs", "cronjobs"]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: accounts-api-namespace
      expression: "object.metadata.namespace == 'accounts-api'"
  validations:
    - expression: "object.spec.?volumes.orValue([]).all(v, !has(v.hostPath))"
      message: "hostPath volumes are not allowed: they expose the node's filesystem, runtime socket and other tenants' logs."
