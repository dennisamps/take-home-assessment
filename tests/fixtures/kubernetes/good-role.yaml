# An acceptable Role: one named resource, read-only. accounts-api does not need it; it exists to
# prove policies/kubernetes/restrict-rbac.yaml allows least-privilege RBAC and is not a blanket deny.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-own-config
  namespace: accounts-api
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["accounts-api-config"]
    verbs: ["get"]
