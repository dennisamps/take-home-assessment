# Build and release integrity (threat-model.md T1, supply-chain part of T2).
# Source on main -> image tagged by commit SHA -> SBOM attestation -> keyless signature -> verify.
name: build

on:
  push:
    branches: [main]

# No default token permissions; the job asks for exactly what it needs.
permissions: {}

env:
  AWS_REGION: ap-south-1
  # 123456789012 is a placeholder for the tooling/build account (ECR and the build role), not
  # production. It must match iam/github-oidc-trust-policy.json. This workflow does not deploy.
  AWS_ROLE_ARN: arn:aws:iam::123456789012:role/accounts-api-github-build
  IMAGE_REPO: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/accounts-api
  # The only identity a verifier should accept: this workflow file, on main.
  CERT_IDENTITY: https://github.com/mal/accounts-api/.github/workflows/build.yml@refs/heads/main
  CERT_ISSUER: https://token.actions.githubusercontent.com

jobs:
  build:
    runs-on: ubuntu-24.04
    # Do not add `environment:` here. It changes the OIDC `sub` claim and the AWS trust policy will reject the job.
    permissions:
      contents: read
      id-token: write # OIDC token, used for the AWS role and for Sigstore keyless signing
    steps:
      # Third-party actions are pinned to full commit SHAs; a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assume AWS build role via OIDC (no static keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${IMAGE_REPO%%/*}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A rerun for the same commit SHA fails here on the immutable tag. That is deliberate.
      - name: Build and push, tagged by commit SHA only
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          # BuildKit's own provenance/SBOM are unsigned. Disabled so the digest is one plain image
          # manifest and the only attestations on it are the signed ones created below.
          provenance: false
          sbom: false

      # Everything after the push refers to the image by digest, never by tag.
      - name: Record image digest reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "IMAGE_REF=${IMAGE_REPO}@${DIGEST}" >> "$GITHUB_ENV"

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Generate SBOM from the pushed image
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          "$SYFT" scan "registry:${IMAGE_REF}" -o spdx-json=sbom.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign the image digest (keyless)
        run: cosign sign --yes "$IMAGE_REF"

      - name: Attach the SBOM as a signed attestation on the image
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE_REF"

      # Same commands a consumer or an admission controller would run. Fails the build if the
      # signature or attestation was not made by this workflow on main.
      - name: Verify signature and SBOM attestation
        run: |
          cosign verify "$IMAGE_REF" \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$CERT_ISSUER" > /dev/null
          cosign verify-attestation "$IMAGE_REF" --type spdxjson \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$CERT_ISSUER" > /dev/null

      - name: Summary
        run: |
          {
            echo "### Signed image"
            echo "\`${IMAGE_REF}\`"
            echo "Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
